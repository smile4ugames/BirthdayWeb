<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Anusha ji ⭐</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- Sambar Vada Custom Cursor -->
    <div id="vada-cursor" class="vada-cursor">
        <svg viewBox="0 0 36 36" class="vada-svg">
            <circle cx="18" cy="18" r="15" fill="#d97706" stroke="#78350f" stroke-width="2.5"/>
            <circle cx="18" cy="18" r="5" fill="#78350f"/>
            <ellipse cx="14" cy="12" rx="4" ry="2.5" fill="#fef3c7" opacity="0.8"/>
            <circle cx="11" cy="22" r="1.5" fill="#15803d"/>
            <circle cx="24" cy="14" r="1.5" fill="#15803d"/>
            <circle cx="21" cy="24" r="1.2" fill="#b91c1c"/>
            <circle cx="13" cy="16" r="1" fill="#fbbf24"/>
        </svg>
    </div>

    <div class="container">
        <h1>Happy Birthday Anusha ji ⭐</h1>
        
        <!-- Dual Welcome Photo Frame Grid (i1.jpg & i2.jpg) -->
        <div class="welcome-photos-container">
            <div class="welcome-photo-frame">
                <img src="./i1.JPG" alt="Anusha ji Moment 1" class="welcome-photo" onerror="this.src='https://images.unsplash.com/photo-1511632765486-a01980e01a18?w=500&q=80'">
            </div>
            <div class="welcome-photo-frame">
                <img src="./i2.jpeg" alt="Anusha ji Moment 2" class="welcome-photo" onerror="this.src='https://images.unsplash.com/photo-1517457373958-b7bdd4587205?w=500&q=80'">
            </div>
        </div>

        <div class="greeting"></div>
        <button class="cta-button">Click to Enter Our World 🤝</button>
    </div>

    <script src="./script.js"></script>
</body>
</html>
